name = "makework-turn"
main = "worker.js"
compatibility_date = "2026-10-01"

# Secrets, set with `npx wrangler secret put <NAME>`: TURN_KEY_ID, TURN_KEY_API_TOKEN, ANALYTICS_API_TOKEN, ACCOUNT_ID.

# The user server's database: accounts' public keys for checking signed requests, and the
# credentials handed out (table turn_grants, from the user server's migrations).
[[d1_databases]]
binding = "DB"
database_name = "makework-users"
database_id = "889739ff-0288-4998-a1f5-7035a5d22287"

[vars]
CAP_GB = "500"
# Credentials per account and per address each hour.
PER_ACCOUNT_HOUR = "6"
PER_IP_HOUR = "20"

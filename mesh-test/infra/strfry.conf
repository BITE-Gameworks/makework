##
## strfry config of the mesh test's local Nostr relays (mwt-relay1..5), mounted at /etc/strfry.conf.
## Based on the dockurr/strfry image's default (strfry 1.1.3). Changed for the test: no write policy plugin (the
## image's default whitelists pubkeys and would reject every Trystero event), no NIP-42 auth, nofiles = 0 (rootless
## podman can't raise the limit), a 1 GiB map (the db lives on a tmpfs), Caddy's X-Forwarded-For as the client IP.
## Ephemeral kinds (20000-29999, which Trystero uses) are broadcast to live subscriptions like on public relays.
##

db = "./strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 1073741824
    noReadAhead = false
}

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 0
    realIpHeader = "x-forwarded-for"

    auth {
        enabled = false
        serviceUrl = ""
    }

    info {
        name = "mwt relay"
        description = "MakeWork mesh test relay"
        pubkey = ""
        contact = ""
        icon = ""
        nips = ""
    }

    maxWebsocketPayloadSize = 131072
    maxReqFilterSize = 200
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxSubsPerConnection = 200

    writePolicy {
        plugin = ""
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        negentropy = 2
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }
}

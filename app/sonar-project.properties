# SonarQube scan of the app (run `sonar-scanner` in app/). Why some rules are off: docs/decisions.md, "SonarQube rules
# we don't follow".
sonar.projectKey=MakeWork
sonar.projectName=MakeWork
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,scripts/**,vendor/**,dist/**,dist-node/**,dist-servers/**,release/**,public/**,resources/**,node_modules/**,android/app/build/**,android/build/**

sonar.issue.ignore.multicriteria=chain,inverted,charcode,clone,spread,loop,key,spacing,nested,toplevel,snippets,execcommand,browsercommand,farewell

# `!x || x.a !== b` stays: `x?.a !== b` passes when both sides are undefined (AGENTS.md).
sonar.issue.ignore.multicriteria.chain.ruleKey=*:S6582
sonar.issue.ignore.multicriteria.chain.resourceKey=**/*
# `!(x > 0)` also rejects NaN; the "opposite operator" lets it through.
sonar.issue.ignore.multicriteria.inverted.ruleKey=*:S1940
sonar.issue.ignore.multicriteria.inverted.resourceKey=**/*
# Byte conversions and hashes members agree on: code points would corrupt bytes and change hashes.
sonar.issue.ignore.multicriteria.charcode.ruleKey=*:S7758
sonar.issue.ignore.multicriteria.charcode.resourceKey=**/*
# The values are often Solid store proxies, which structuredClone refuses.
sonar.issue.ignore.multicriteria.clone.ruleKey=*:S7784
sonar.issue.ignore.multicriteria.clone.resourceKey=**/*
# A copy before a loop that changes the collection it walks.
sonar.issue.ignore.multicriteria.spread.ruleKey=*:S7747
sonar.issue.ignore.multicriteria.spread.resourceKey=**/*
# The "next free name" loop: the counter only builds the name being tested.
sonar.issue.ignore.multicriteria.loop.ruleKey=*:S1994
sonar.issue.ignore.multicriteria.loop.resourceKey=**/*
# React rules: Solid has no keys and doesn't keep JSX whitespace; labels are spaced with CSS.
sonar.issue.ignore.multicriteria.key.ruleKey=typescript:S6477
sonar.issue.ignore.multicriteria.key.resourceKey=**/*
sonar.issue.ignore.multicriteria.spacing.ruleKey=typescript:S6772
sonar.issue.ignore.multicriteria.spacing.resourceKey=**/*
# Fire-and-forget `void x.catch(...)` and entry points that also run as CommonJS.
sonar.issue.ignore.multicriteria.nested.ruleKey=*:S9381
sonar.issue.ignore.multicriteria.nested.resourceKey=**/*
sonar.issue.ignore.multicriteria.toplevel.ruleKey=*:S7785
sonar.issue.ignore.multicriteria.toplevel.resourceKey=**/*
# `${1:name}` is snippet placeholder syntax, not a template literal.
sonar.issue.ignore.multicriteria.snippets.ruleKey=typescript:S3786
sonar.issue.ignore.multicriteria.snippets.resourceKey=src/plugins/builtin/code/snippets.ts
# execCommand keeps the native undo history in contenteditable, and nothing replaces it yet.
sonar.issue.ignore.multicriteria.execcommand.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.execcommand.resourceKey=src/editor/RichEditor.tsx
sonar.issue.ignore.multicriteria.browsercommand.ruleKey=javascript:S1874
sonar.issue.ignore.multicriteria.browsercommand.resourceKey=electron/sharedBrowser.js
# beforeunload still needs returnValue in Chromium.
sonar.issue.ignore.multicriteria.farewell.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.farewell.resourceKey=src/core/farewell.ts
